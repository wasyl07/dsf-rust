[package]
name = "dsf"
version = "0.1.0"
edition = "2021"
description = "Synchronous client for the Duet3D DuetSoftwareFramework (DSF) UNIX socket API"
license = "AGPL-3.0-only"
readme = "README.md"
keywords = ["duet3d", "dsf", "reprap", "3d-printing"]
categories = ["api-bindings"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
